{% extends 'nflpix/base.html' %}

{% block title %}Check Your Email - PrimeTimePix{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <div class="bg-white dark:bg-surface-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-card dark:shadow-card-dark overflow-hidden">
            <div class="px-6 py-10 text-center">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-accent-100 dark:bg-neon/10 mb-4">
                    <i class="fas fa-envelope text-2xl text-accent-600 dark:text-neon"></i>
                </div>
                <h1 class="text-2xl font-black font-display uppercase tracking-tight text-gray-900 dark:text-white mb-2">Check Your Email</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
                    We've sent you instructions for resetting your password. Please check your email and follow the link provided.
                </p>
                <a href="{% url 'login' %}"
                   class="inline-flex items-center justify-center border border-accent-600 dark:border-neon text-accent-600 dark:text-neon font-bold py-2.5 px-5 rounded-lg text-sm hover:bg-accent-50 dark:hover:bg-neon/10 transition">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

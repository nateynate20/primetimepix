{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · PrimeTimePix</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 380px; }
    img { height: 44px; width: auto; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.6; color: #9ca3af; margin: 0 0 24px; }
    button {
      background: #39ff14; color: #0a0a0a; border: 0; border-radius: 10px;
      font-size: 15px; font-weight: 700; padding: 12px 28px; cursor: pointer;
    }
    .dot { color: #39ff14; }
  </style>
</head>
<body>
  <div class="card">
    <img src="{% static 'images/logo-light.png' %}" alt="PrimeTimePix">
    <h1>You're offline<span class="dot">.</span></h1>
    <p>We can't reach the field right now. Check your connection and try again — your picks are safe.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
